[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph-rag"
version = "0.1.0"
description = "CV-grade Graph RAG system for software repositories - Phase 1: Ingestion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
